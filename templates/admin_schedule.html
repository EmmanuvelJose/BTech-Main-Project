{% include 'adminheader.html' %}
<br><br><br><br><br><br><br>


<style>
    center {
        margin-top: 20px;
    }

    table {
        width: 80%;
        margin-bottom: 20px;
        border-collapse: collapse;
    }

    th, td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #020202;
    }

    th {
        background-color: #e0d4d4;
    }

    input[type="text"],
    select,
    input[type="file"],
    input[type="date"] {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
    }

    input[type="submit"] {
        background-color: #4CAF50;
        color: rgb(0, 0, 0);
        padding: 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    input[type="submit"]:hover {
        background-color: #45a049;
    }
</style>

<center>
    <h1>Schedule</h1>
    <section style="background: url(/static/images/m2.jpg) center center no-repeat;
    background-size:cover;
    background-attachment: fixed;
    color: #cfcfcf;height: auto;
          margin-top:80px;" id="home">
         <div class="overlay">
             <div class="container">
                 <div class="row">
 
    <form method="post"  enctype="multipart/form-data">
        <table style="color: #020202;">
 
            <tr>
                <th>Start Time</th>
                <td><input type="time" name="stime" class="form-control"></td>
            </tr>
            <tr>
                <th>End Time</th>
                <td><input type="time" name="etime" class="form-control"></td>
            </tr>  
            <tr>
                <th>Date</th>
                <td><input type="date" name="da" class="form-control"></td>
            </tr>
            <tr>
                <td><input type="submit" name="submit" value="Submit"></td>
            </tr>
        </table>
        <table>
            <tr>
                <th>Start Time</th>
                <th>End Time</th>
                <th>No.Of Patients</th>
                <th>Date</th>
                <th>Status</th>
            </tr>
            {% for i in data['view'] %}
            <tr>
                <td>{{i['start_time']}}</td>
                <td>{{i['end_time']}}</td>
                <td>{{i['no_of_patient']}}</td>
                <td>{{i['date']}}</td>
                <td>{{i['status']}}</td>
            </tr>
            {% endfor %}
        </table>
    </form>
</center>
